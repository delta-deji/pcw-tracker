<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PCW-1311 Delivery Tracker</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#ffffff; --fg:#1a1d23; --muted:#6b7280; --border:#e5e7eb;
    --blue:#2451c9; --blue-bg:#eef2ff; --blue-bar:#3b5fdb;
    --green:#15803d; --green-bg:#e8f7ee; --green-bar:#1a9f54;
    --amber:#b45309; --amber-bg:#fef3dc; --amber-bar:#f5a623;
    --red:#c0271d; --red-bg:#fdeeec; --red-bar:#e5484d;
    --purple:#6b3fc9; --purple-bg:#f1ecfb; --purple-bar:#8257d6;
    --grey:#6b7280; --grey-bg:#eef0f2; --grey-bar:#c7cbd1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111317; --card:#1b1e24; --fg:#e7e8ea; --muted:#9aa0ab; --border:#2b2f37;
      --blue:#7c96ff; --blue-bg:#1a2140; --blue-bar:#5b74e8;
      --green:#4fd87e; --green-bg:#0f2a1a; --green-bar:#1f9c57;
      --amber:#ffbf5e; --amber-bg:#3a2a08; --amber-bar:#c98420;
      --red:#ff8884; --red-bg:#3a1512; --red-bar:#c43a35;
      --purple:#b49bff; --purple-bg:#241a3a; --purple-bar:#9b7ce0;
      --grey:#9aa0ab; --grey-bg:#262a31; --grey-bar:#444b57;
    }
  }
  :root[data-theme="dark"] {
    --bg:#111317; --card:#1b1e24; --fg:#e7e8ea; --muted:#9aa0ab; --border:#2b2f37;
    --blue:#7c96ff; --blue-bg:#1a2140; --blue-bar:#5b74e8;
    --green:#4fd87e; --green-bg:#0f2a1a; --green-bar:#1f9c57;
    --amber:#ffbf5e; --amber-bg:#3a2a08; --amber-bar:#c98420;
    --red:#ff8884; --red-bg:#3a1512; --red-bar:#c43a35;
    --purple:#b49bff; --purple-bg:#241a3a; --purple-bar:#9b7ce0;
    --grey:#9aa0ab; --grey-bg:#262a31; --grey-bar:#444b57;
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; padding:16px; max-width:900px; margin-inline:auto; font-size:14px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .headrow { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 12px; }
  .breadcrumb { color:var(--muted); font-size:12px; }
  .breadcrumb strong { color:var(--fg); }
  .right-meta { color:var(--muted); font-size:12px; text-align:right; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .accent { border-left:3px solid var(--blue); }
  .label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; }
  .pill .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .pill.blue { background:var(--blue-bg); color:var(--blue); } .pill.blue .dot{background:var(--blue);}
  .pill.green { background:var(--green-bg); color:var(--green); } .pill.green .dot{background:var(--green);}
  .pill.amber { background:var(--amber-bg); color:var(--amber); } .pill.amber .dot{background:var(--amber);}
  .pill.red { background:var(--red-bg); color:var(--red); } .pill.red .dot{background:var(--red);}
  .pill.purple { background:var(--purple-bg); color:var(--purple); } .pill.purple .dot{background:var(--purple);}
  .pill.grey { background:var(--grey-bg); color:var(--grey); } .pill.grey .dot{background:var(--grey);}
  .headline-layout { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .pct-big { font-size:42px; font-weight:800; color:var(--blue); line-height:1; min-width:90px; }
  .headline-main { flex:1; min-width:240px; }
  .bar { height:9px; background:var(--grey-bg); border-radius:999px; overflow:hidden; margin:10px 0; display:flex; }
  .bar > div { height:100%; }
  .statboxes { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:16px; margin-top:14px; }
  .statbox .num { font-size:20px; font-weight:800; }
  .statbox .ctx { font-size:11px; color:var(--muted); }
  .num.green{color:var(--green);} .num.red{color:var(--red);} .num.amber{color:var(--amber);}
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  td.num-col, th.num-col { text-align:right; }
  .delta { font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:4px; }
  .delta.up { background:var(--green-bg); color:var(--green); }
  .delta.down { background:var(--red-bg); color:var(--red); }
  .delta.flat { background:var(--grey-bg); color:var(--grey); }
  .warn { background:var(--amber-bg); color:var(--amber); border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; margin:8px 0; }
  .section-title { font-size:13px; font-weight:800; margin:0 0 12px; padding-bottom:8px; color:var(--fg); text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid var(--blue); display:inline-block; }
  details { margin-top:4px; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  .epic-row { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .epic-row:last-child { border-bottom:none; }
  .epic-row .epic-chevron, .epic-row > span:nth-child(2), .epic-row .epic-cols { padding-top:2px; }
  .epic-cols-header-row { display:flex; align-items:center; gap:10px; padding:0 0 6px; }
  .epic-cols-header { margin-left:auto; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  .epic-chevron { color:var(--muted); font-size:11px; width:12px; }
  .epic-key { font-weight:700; font-size:13px; }
  .epic-title { color:var(--muted); font-size:12px; }
  .epic-cols-grid { display:grid; grid-template-columns:56px 90px 36px 56px 64px; gap:14px; align-items:center; }
  .epic-cols { margin-left:auto; font-size:12px; white-space:nowrap; }
  .mini-bar { width:90px; height:7px; background:var(--grey-bg); border-radius:999px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .mini-bar > div { height:100%; }
  .task-sub-table { margin:4px 0 10px 22px; font-size:12px; }
  .gantt-row { display:grid; grid-template-columns:170px 1fr; align-items:center; gap:8px; padding:7px 0; }
  .gantt-dates { color:var(--muted); font-size:11px; }
  .gantt-track { position:relative; height:22px; background:var(--grey-bg); border-radius:4px; }
  .gantt-bar { position:absolute; top:0; height:100%; border-radius:4px; display:flex; align-items:center; padding:0 6px; font-size:10px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; }
  .gantt-today { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--red); z-index:2; }
  .gantt-commitment { position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--blue); background-image:linear-gradient(var(--blue) 60%, transparent 0%); background-size:2px 6px; z-index:2; }
  .gantt-wrap { position:relative; }
  .gantt-gridlines { position:absolute; top:0; bottom:0; left:178px; right:0; pointer-events:none; }
  .gantt-gridline { position:absolute; top:0; bottom:0; width:1px; background:var(--border); }
  .gantt-axis-label { position:absolute; top:0; font-size:11px; font-weight:700; color:var(--fg); background:var(--card); padding:0 4px; transform:translateX(-50%); white-space:nowrap; }
  .gantt-rows { position:relative; }
  .activity-group-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin:14px 0 6px; }
  .activity-row { display:flex; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .activity-row:last-child { border-bottom:none; }
  .activity-row .k { color:var(--muted); font-size:11px; min-width:60px; }
  .activity-row .t { flex:1; }
  .dep-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .dep-row:last-child { border-bottom:none; }
  .dep-row .reason { color:var(--muted); font-size:12px; flex:1; min-width:160px; }
  footer { color:var(--muted); font-size:11px; margin-top:20px; padding-top:12px; border-top:1px solid var(--border); line-height:1.6; }
  a { color:var(--blue); text-decoration:none; font-weight:600; }
  .small { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">Loading PCW-1311 tracker&hellip;</div>
<script>
(function(){
  const BUCKET_LABEL = { notStarted:"Not started", inDevelopment:"In development", inPR:"In PR", inQA:"In QA", done:"Done", blocked:"Blocked", excluded:"Excluded", unmapped:"Unmapped" };
  const BUCKET_COLOR = { notStarted:"grey", inDevelopment:"amber", inPR:"blue", inQA:"purple", done:"green", blocked:"red", excluded:"grey", unmapped:"grey" };
  const BAR_VAR = { done:"var(--green-bar)", inPR:"var(--blue-bar)", inDevelopment:"var(--amber-bar)", inQA:"var(--purple-bar)", blocked:"var(--red-bar)", notStarted:"var(--grey-bar)" };
  const SIGNAL_COLOR = { green:"green", amber:"amber", red:"red", noDate:"grey" };
  const SIGNAL_LABEL = { green:"On track", amber:"Under pressure", red:"Critical", noDate:"No date" };

  function fmtDate(iso, opts){
    if(!iso) return "Unknown";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", opts || { day:"numeric", month:"short" });
  }
  function fmtDateTime(iso){
    if(!iso) return "Unknown";
    const d = new Date(iso);
    return d.toLocaleDateString("en-GB", { day:"numeric", month:"short" }) + ", " + d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
  }
  function isStaleData(computedAt){
    if(!computedAt) return true;
    const hrs = (Date.now() - new Date(computedAt).getTime()) / 3600000;
    return hrs > 36;
  }
  function escapeHtml(s){
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function deltaBadge(cur, prev){
    if (prev == null) return "";
    const d = Number((cur - prev).toFixed(1)); // avoid float noise like 1.7000000000000028
    if (d === 0) return `<span class="delta flat">+0</span>`;
    return `<span class="delta ${d>0?"up":"down"}">${d>0?"+":""}${d}</span>`;
  }

  async function render(){
    const app = document.getElementById("app");
    let db;
    try { db = await claude.use("db"); } catch(e) { db = null; }
    if (!db) {
      app.innerHTML = '<div class="card"><p>Sign in to claude.ai to view this tracker.</p></div>';
      return;
    }
    const [configSnap, currentSnap] = await Promise.all([
      db.doc("config/config").get(),
      db.doc("current/current").get()
    ]);
    if (!currentSnap.exists) {
      app.innerHTML = '<div class="card"><p>No data yet - the tracker has been set up but has not run its first refresh.</p></div>';
      return;
    }
    const config = configSnap.exists ? configSnap.data() : {};
    const cur = currentSnap.data();
    const h = cur.headline;

    const snapsQuery = await db.collection("snapshots").orderBy("__name__", "desc").limit(30).get();
    const snaps = snapsQuery.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.id.localeCompare(a.id)); // newest first, explicit - don't rely on the query's own order
    const staleWarn = isStaleData(cur.computedAt);

    const tasksByEpic = {};
    for (const t of cur.tasks) { (tasksByEpic[t.epic] = tasksByEpic[t.epic] || []).push(t); }

    let html = "";

    // Header
    html += `<div class="headrow"><div>`;
    html += `<h1>${escapeHtml(config.pcwTitle||config.pcwKey)} Delivery Tracker</h1>`;
    html += `<div class="breadcrumb"><strong>${escapeHtml(config.pcwKey)}</strong> &nbsp;|&nbsp; ${cur.scopeEpicCount} of ${cur.totalChildEpicCount} epics tracked</div>`;
    html += `</div><div class="right-meta">Data as of ${fmtDateTime(cur.computedAt)}<br>${h.countedTasks} tasks tracked</div></div>`;

    if (staleWarn) html += `<div class="warn">Data is older than one working day - the scheduled refresh may have been missed.</div>`;
    if (config.commitments?.pcwLevel?.date) {
      html += `<div class="small" style="margin-bottom:10px;">Commitment: <strong>${escapeHtml(config.commitments.pcwLevel.label||"")} - ${fmtDate(config.commitments.pcwLevel.date,{day:"numeric",month:"long",year:"numeric"})}</strong></div>`;
    }

    // Headline card
    html += `<div class="card accent">`;
    let completionLabel = `Task completion - ${h.countedTasks} tasks across ${cur.epics.length} epics`;
    const excludedBits = [];
    if (h.buckets.excluded > 0) excludedBits.push(`${h.buckets.excluded} excluded`);
    if (h.buckets.unmapped > 0) excludedBits.push(`${h.buckets.unmapped} unmapped`);
    if (excludedBits.length) completionLabel += ` &middot; ${excludedBits.join(", ")}`;
    html += `<div class="label">${completionLabel}</div>`;
    html += `<div class="row" style="margin-top:8px;">`;
    for (const b of ["notStarted","inDevelopment","inPR","inQA","done","blocked"]) {
      html += `<span class="pill ${BUCKET_COLOR[b]}"><span class="dot"></span>${h.buckets[b]} ${BUCKET_LABEL[b]}</span>`;
    }
    html += `</div>`;
    html += `<div class="headline-layout" style="margin-top:12px;">`;
    html += `<div class="pct-big">${h.percentComplete}%</div>`;
    html += `<div class="headline-main">`;
    html += `<div class="bar">`;
    for (const b of ["done","inPR","inQA","inDevelopment","blocked","notStarted"]) {
      const pct = h.countedTasks ? (100*h.buckets[b]/h.countedTasks) : 0;
      if (pct>0) html += `<div style="width:${pct}%; background:${BAR_VAR[b]||'var(--grey-bar)'}"></div>`;
    }
    html += `</div>`;
    html += `<div class="statboxes">`;
    html += `<div class="statbox"><div class="label">Run rate</div><div class="num">${h.runRatePerWeek.toFixed(1)}/wk</div><div class="ctx">avg over last 7 days</div></div>`;
    html += `<div class="statbox"><div class="label">Required rate</div><div class="num ${h.signal==='red'?'red':(h.signal==='amber'?'amber':'green')}">${h.requiredRatePerWeek.toFixed(1)}/wk</div><div class="ctx">${fmtDate(h.targetDate)} &middot; ${h.workingWeeksLeft} wks left</div></div>`;
    html += `<div class="statbox"><div class="label">Status</div><div class="num ${SIGNAL_COLOR[h.signal]}">${SIGNAL_LABEL[h.signal]}</div><div class="ctx">${escapeHtml(h.signalReason)}</div></div>`;
    html += `</div></div></div>`;
    if (h.paceConfidence && h.paceConfidence.low) {
      html += `<div class="warn" style="margin-top:10px;">Early data - ${escapeHtml(h.paceConfidence.note)}</div>`;
      html += `<div class="small" style="margin-top:6px;">Forecast finish: available once there's a full week of run-rate history (${h.paceConfidence.workingDaysOfHistory} working day${h.paceConfidence.workingDaysOfHistory===1?"":"s"} so far).</div>`;
    } else {
      html += `<div class="small" style="margin-top:6px;">Forecast finish <strong>${fmtDate(h.forecastFinish,{day:"numeric",month:"short",year:"numeric"})}</strong> (${h.forecastWorkingDaysLate} working days late vs target) - ${escapeHtml(h.forecastLabel)}</div>`;
    }
    html += `</div>`;

    // Needs attention
    html += `<div class="card"><div class="section-title">Needs attention</div>`;
    if (!cur.needsAttention || cur.needsAttention.length === 0) {
      html += `<div class="small">Nothing needs attention</div>`;
    } else {
      for (const item of cur.needsAttention.slice(0,5)) {
        html += `<div class="activity-row"><span class="t small">${escapeHtml(item.text)}</span></div>`;
      }
      if (cur.needsAttention.length > 5) html += `<div class="small" style="margin-top:6px;">+${cur.needsAttention.length-5} more</div>`;
    }
    html += `</div>`;

    // Daily snapshot
    html += `<div class="card"><div class="section-title">Daily snapshot</div>`;
    if (snaps.length === 0) {
      html += `<div class="small">No snapshot yet.</div>`;
    } else {
      html += `<table><thead><tr><th>Date</th><th class="num-col">% complete</th><th class="num-col">Done</th><th class="num-col">In progress</th><th class="num-col">Total</th></tr></thead><tbody>`;
      for (let i=0;i<snaps.length;i++) {
        const s = snaps[i]; const prev = i<snaps.length-1 ? snaps[i+1] : null; // snaps is newest-first; "previous day" is the next row down
        html += `<tr><td>${s.id}${s.configChangeMarker && !s.configChangeMarker.startsWith("First") ? ' <span class="small">('+escapeHtml(s.configChangeMarker)+')</span>' : ''}</td>`;
        html += `<td class="num-col">${s.percentComplete}%${prev?deltaBadge(s.percentComplete,prev.percentComplete):''}</td>`;
        html += `<td class="num-col">${s.doneTasks}${prev?deltaBadge(s.doneTasks,prev.doneTasks):''}</td>`;
        html += `<td class="num-col">${s.inProgressTasks ?? '-'}${prev && prev.inProgressTasks!=null?deltaBadge(s.inProgressTasks,prev.inProgressTasks):''}</td>`;
        html += `<td class="num-col">${s.totalCounted}</td></tr>`;
      }
      html += `</tbody></table>`;
    }
    html += `<div class="small" style="margin-top:8px;">First snapshot - reporting starts ${fmtDate(cur.reportingStart,{day:"numeric",month:"long",year:"numeric"})}. A working day with no refresh shows as "no snapshot."</div>`;
    html += `</div>`;

    // RAG legend
    html += `<div class="card"><div class="row" style="justify-content:space-between;">`;
    html += `<div style="flex:1; min-width:160px;"><span class="pill green"><span class="dot"></span>On track</span><div class="small" style="margin-top:4px;">Required at or below actual pace</div></div>`;
    html += `<div style="flex:1; min-width:160px;"><span class="pill amber"><span class="dot"></span>Under pressure</span><div class="small" style="margin-top:4px;">Required up to 1.5&times; actual</div></div>`;
    html += `<div style="flex:1; min-width:160px;"><span class="pill red"><span class="dot"></span>Critical</span><div class="small" style="margin-top:4px;">Required above 1.5&times; actual, or past due</div></div>`;
    html += `</div></div>`;

    // Epic run rates (expandable)
    html += `<div class="card"><div class="section-title">Epic run rates</div>`;
    html += `<div class="epic-cols-header-row"><div class="epic-cols-header epic-cols-grid">`;
    html += `<span>Left</span><span>Progress</span><span>%</span><span>Time left</span><span>Status</span></div></div>`;
    for (const e of cur.epics) {
      const tasks = tasksByEpic[e.key] || [];
      html += `<details><summary><div class="epic-row">`;
      html += `<span class="epic-chevron">&#9656;</span>`;
      html += `<span><a href="https://dicetech.atlassian.net/browse/${e.key}" target="_blank" rel="noopener">${e.key}</a> <span class="epic-title">${escapeHtml(e.title)}</span></span>`;
      html += `<div class="epic-cols epic-cols-grid">`;
      html += `<span>${e.tasksLeft} left</span>`;
      html += `<span class="mini-bar"><div style="width:${e.percentComplete}%; background:${e.percentComplete>=100?'var(--green-bar)':'var(--blue)'}"></div></span>`;
      html += `<span>${e.percentComplete}%</span>`;
      html += `<span>${e.workingWeeksLeft!=null ? e.workingWeeksLeft+" wks" : "No date"}</span>`;
      html += `<span class="pill ${SIGNAL_COLOR[e.signal]}">${e.signal==='noDate' ? 'No date' : (e.requiredRatePerWeek!=null ? e.requiredRatePerWeek.toFixed(1)+'/wk' : '-')}</span>`;
      html += `</div></div></summary>`;
      html += `<div class="task-sub-table"><table><tbody>`;
      for (const t of tasks) {
        let extra = "";
        if (t.bucket==="blocked") extra = t.daysBlocked!=null ? `${t.daysBlocked}d blocked` : "blocked (since unknown)";
        if (t.bucket==="done") extra = "done "+fmtDate(t.doneAt);
        html += `<tr><td style="width:90px;">${t.key}</td><td><span class="pill ${BUCKET_COLOR[t.bucket]}"><span class="dot"></span>${BUCKET_LABEL[t.bucket]}</span></td><td class="small">${extra}</td></tr>`;
      }
      html += `</table></div></details>`;
    }
    html += `</div>`;

    // Gantt
    html += `<div class="card"><div class="section-title">Gantt</div>`;
    const datedEpics = cur.epics.filter(e => e.startDate && e.dueDate);
    if (datedEpics.length === 0) {
      html += `<div class="small">No in-scope epics have both a start and a due date yet.</div>`;
    } else {
      const allDates = datedEpics.flatMap(e => [new Date(e.startDate), new Date(e.dueDate)]);
      allDates.push(new Date());
      if (config.commitments?.pcwLevel?.date) allDates.push(new Date(config.commitments.pcwLevel.date));
      const minD = new Date(Math.min(...allDates)); const maxD = new Date(Math.max(...allDates));
      // pad the window by a few days either side so bars and the axis aren't flush against the edge
      minD.setDate(minD.getDate()-2); maxD.setDate(maxD.getDate()+2);
      const span = Math.max(1, (maxD-minD));
      const todayPct = 100*(new Date()-minD)/span;
      const commitmentPct = config.commitments?.pcwLevel?.date ? 100*(new Date(config.commitments.pcwLevel.date)-minD)/span : null;

      // gridlines + axis labels, one shared overlay so every row's track lines up with the same dates
      let gridHtml = '<div class="gantt-gridlines">';
      let tick = new Date(minD); tick.setDate(tick.getDate() + ((8 - tick.getDay()) % 7));
      while (tick <= maxD) {
        const pct = 100*(tick-minD)/span;
        gridHtml += `<div class="gantt-gridline" style="left:${pct}%"></div>`;
        gridHtml += `<span class="gantt-axis-label" style="left:${pct}%">${fmtDate(tick.toISOString().slice(0,10))}</span>`;
        tick.setDate(tick.getDate()+7);
      }
      gridHtml += '</div>';

      html += `<div class="gantt-wrap">` + gridHtml;
      html += `<div style="height:18px;"></div>`; // space for axis labels above the first row
      html += `<div class="gantt-rows">`;
      for (const e of cur.epics) {
        html += `<div class="gantt-row"><div><a href="https://dicetech.atlassian.net/browse/${e.key}" target="_blank" rel="noopener">${e.key}</a> <span class="epic-title">${escapeHtml(e.title)}</span>`;
        html += `<div class="gantt-dates">${e.startDate && e.dueDate ? fmtDate(e.startDate)+' to '+fmtDate(e.dueDate) : 'No date'}</div></div>`;
        html += `<div class="gantt-track">`;
        if (e.startDate && e.dueDate) {
          const left = 100*(new Date(e.startDate)-minD)/span;
          const width = 100*(new Date(e.dueDate)-new Date(e.startDate))/span;
          const color = e.signal==='red'?'var(--red-bar)':(e.signal==='amber'?'var(--amber-bar)':'var(--green-bar)');
          html += `<div class="gantt-bar" style="left:${left}%; width:${Math.max(width,4)}%; background:${color};">${e.key} &middot; ${e.percentComplete}%</div>`;
        }
        if (commitmentPct != null) html += `<div class="gantt-commitment" style="left:${commitmentPct}%" title="Commitment: ${fmtDate(config.commitments.pcwLevel.date)}"></div>`;
        html += `<div class="gantt-today" style="left:${todayPct}%" title="Today"></div>`;
        html += `</div></div>`;
      }
      html += `</div></div>`;
      html += `<div class="small" style="margin-top:6px;">Solid red line = today. Dashed blue line = commitment (${fmtDate(config.commitments?.pcwLevel?.date)}).</div>`;
    }
    html += `<div class="row" style="margin-top:10px;">`;
    html += `<span class="pill green"><span class="dot"></span>On track</span><span class="pill amber"><span class="dot"></span>Under pressure</span><span class="pill red"><span class="dot"></span>Critical</span><span class="pill grey"><span class="dot"></span>No date</span>`;
    html += `</div></div>`;

    // Task activity
    html += `<div class="card"><div class="section-title">Task activity</div>`;
    html += `<div class="activity-group-label" style="color:var(--blue);">In PR (${cur.taskActivity.inPR.length})</div>`;
    if (cur.taskActivity.inPR.length === 0) html += `<div class="small">None</div>`;
    for (const k of cur.taskActivity.inPR) {
      const t = cur.tasks.find(x=>x.key===k);
      html += `<div class="activity-row"><span class="k">${t?t.epic:''}</span><span class="t">${k}</span><span class="pill blue"><span class="dot"></span>In PR</span></div>`;
    }
    if (cur.taskActivity.inQA && cur.taskActivity.inQA.length > 0) {
      html += `<div class="activity-group-label" style="color:var(--purple);">In QA (${cur.taskActivity.inQA.length})</div>`;
      for (const k of cur.taskActivity.inQA) {
        const t = cur.tasks.find(x=>x.key===k);
        html += `<div class="activity-row"><span class="k">${t?t.epic:''}</span><span class="t">${k}</span><span class="pill purple"><span class="dot"></span>In QA</span></div>`;
      }
    }
    html += `<div class="activity-group-label" style="color:var(--red);">Blocked (${cur.taskActivity.blocked.length})</div>`;
    for (const b of cur.taskActivity.blocked) {
      const t = cur.tasks.find(x=>x.key===b.key);
      html += `<div class="activity-row"><span class="k">${t?t.epic:''}</span><span class="t">${b.key}</span><span class="small">${b.daysBlocked!=null?b.daysBlocked+(b.daysBlocked===1?' working day blocked':' working days blocked'):'blocked, since-date unknown (data gap)'}</span></div>`;
    }
    html += `<div class="activity-group-label" style="color:var(--red);">Stale (${cur.taskActivity.stale.length}) - active, no Jira update since last working day</div>`;
    if (cur.taskActivity.stale.length === 0) html += `<div class="small">${escapeHtml(cur.taskActivity.staleNote || "No stale tasks")}</div>`;
    html += `</div>`;

    // Dependency risk
    html += `<div class="card"><div class="section-title">Dependency risk</div>`;
    if (!cur.dependencies.links || cur.dependencies.links.length === 0) {
      html += `<div class="small">No dependency links recorded in Jira.</div>`;
    } else {
      for (const l of cur.dependencies.links) {
        html += `<div class="dep-row">`;
        html += `<span>${l.blocker} &rarr; ${l.blocked}</span>`;
        html += `<span class="reason">${escapeHtml(l.reason)}</span>`;
        html += `<span class="pill grey"><span class="dot"></span>${l.state}</span>`;
        html += `</div>`;
      }
    }
    html += `</div>`;

    // Not tracked
    html += `<div class="card">`;
    if (cur.notTrackedOpenCount > 0) {
      const byReason = cur.notTrackedOpenByReason || {};
      let noticeText = `${cur.notTrackedOpenCount} untracked epic${cur.notTrackedOpenCount===1?"":"s"} still open`;
      if (byReason.testing) noticeText += `, ${byReason.testing} of them Testing`;
      html += `<div class="warn" style="margin-bottom:8px;">${noticeText}</div>`;
    }
    html += `<details><summary class="small" style="font-weight:700;">Not tracked (${cur.notTracked.length})</summary>`;
    html += `<div style="margin-top:8px;">`;
    for (const nt of cur.notTracked) {
      html += `<div class="activity-row"><span class="t">${nt.key} <span class="epic-title">${escapeHtml(nt.title)}</span></span><span class="small">${nt.status} &middot; ${escapeHtml(nt.reason)}</span></div>`;
    }
    html += `</div></details></div>`;

    // Footer
    html += `<footer>`;
    html += `<div><strong>How the status (On track / Under pressure / Critical) is worked out:</strong> it compares the pace needed to hit the date ("required rate" = tasks left divided by weeks left) against the pace actually happening ("run rate", from the last 7 days). On track if the pace needed is no higher than the actual pace. Under pressure if it needs up to 1.5 times the actual pace. Critical if it needs more than that, or the date has already passed with work still left.</div>`;
    html += `<div style="margin-top:6px;"><strong>Does not measure:</strong> quality, defects, effort weighting, capacity, budget or stakeholder confidence. Each task counts equally, nothing is guessed, dates included.</div>`;
    html += `<div style="margin-top:6px;">${cur.dataConfidence.epicsWithDatesPercent}% of in-scope epics have dates &middot; ${cur.dataConfidence.unmappedCount} unmapped &middot; reconciled with Jira at ${fmtDateTime(cur.dataConfidence.reconciledAt)}</div>`;
    if (cur.dataConfidence.knownGaps && cur.dataConfidence.knownGaps.length) {
      html += `<div style="margin-top:6px;">Known gaps: ${cur.dataConfidence.knownGaps.map(escapeHtml).join(" &middot; ")}</div>`;
    }
    html += `</footer>`;

    app.innerHTML = html;
  }

  render().catch(e => {
    document.getElementById("app").innerHTML = '<div class="card"><p>Error loading tracker: ' + escapeHtml(e && e.message ? e.message : String(e)) + '</p></div>';
  });
})();
</script>
</body>
</html>
